<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faceless Listicle</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: {{BACKGROUND}}; }
      #main { position: relative; overflow: hidden; background: {{BACKGROUND}}; color: {{FOREGROUND}}; }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-fps="{{FPS}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
    >
      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="{{HOOK_DURATION}}"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="{{WIDTH}}"
        data-height="{{HEIGHT}}"
      ></div>
      <div
        id="content"
        class="clip"
        data-composition-id="content"
        data-composition-src="compositions/content.html"
        data-start="{{CONTENT_START}}"
        data-duration="{{CONTENT_DURATION}}"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="{{WIDTH}}"
        data-height="{{HEIGHT}}"
      ></div>
      <div
        id="cta"
        class="clip"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="{{CTA_START}}"
        data-duration="{{CTA_DURATION}}"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="{{WIDTH}}"
        data-height="{{HEIGHT}}"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
